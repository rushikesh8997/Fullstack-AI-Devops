name: Demo CI Env Secrets

on:
  # push
#  workflow_dispatch

env: 
 GLOBAL_APP_ENV: global_dev #workflow level env

jobs:
  build:
    runs-on: ubuntu-latest
    env: 
        JOB_APP_ENV: job_dev #job level env
    steps:
      - name: Say Hello
        run: echo "Hello from second workflow!"

      - name: Install
        env: 
         APP_ENV: dev #stepS level env
         DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: echo "Environment $APP_ENV using $DB_PASSWORD, $GLOBAL_APP_ENV, $JOB_APP_ENV"
      
      - name: Create demo file
        run: 
          echo "Hello from CI Pipeline" > demo.txt 
          echo "File created successfully"

      - name: Upload Demo
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-demo
          path: .  #Upload the current directory entirely.

  test:
    runs-on: ubuntu-latest
    needs: build  #build job need to be completed successfully to run test job 

    steps:
      - name: Test Job
        run: echo "TestJob"
